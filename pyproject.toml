[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "slashdigitize"
version = "0.2.0"
description = "Audio and video digitization with GTK4, arecord, FFmpeg and VapourSynth"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{name = "slashmad"}]
dependencies = []
license-files = ["LICENSE"]
readme = "README.md"

[project.scripts]
slashdigitize = "slashdigitize.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slashdigitize = ["style.css", "README.md", "assets/icons/hicolor/*/apps/*.png",
                 "assets/icons/hicolor/scalable/actions/*.svg"]

[project.urls]
Homepage = "https://github.com/slashmad/SlashDigitize"
Repository = "https://github.com/slashmad/SlashDigitize"
Issues = "https://github.com/slashmad/SlashDigitize/issues"
