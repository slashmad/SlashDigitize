# Unit tests, headless Weston UI smoke test and Fedora 45 wheel/sdist/RPM build on every
# push to main and every pull request. Real capture devices and GPU encoding remain outside
# CI scope; the AppImage and Flatpak release recipes are documented in packaging/.
name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: ${{ github.workspace }}

jobs:
  fedora-45:
    name: Fedora 45 verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: quay.io/fedora/fedora:45
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build and test dependencies
        run: |
          dnf --assumeyes install \
            git tar gzip findutils \
            python3 python3-devel python3-pip python3-wheel python3-setuptools \
            pyproject-rpm-macros rpm-build \
            python3-gobject python3-cairo gtk4 libadwaita gtksourceview5 adwaita-icon-theme \
            desktop-file-utils appstream weston

      - uses: actions/checkout@v4

      - name: Run unit tests
        run: PYTHONPATH=src python3 -B -m unittest discover -s tests -v

      - name: Run headless Weston UI smoke test
        run: python3 -B scripts/smoke.py

      - name: Build wheel, sdist and Fedora RPM
        run: python3 -B scripts/build.py --out artifacts/ci-native --rpm

      - uses: actions/upload-artifact@v4
        with:
          name: SlashDigitize-Fedora45-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ci-native/*.whl
            artifacts/ci-native/*.tar.gz
            artifacts/ci-native/*.rpm
